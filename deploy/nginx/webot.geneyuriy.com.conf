server {
    listen 80;
    listen [::]:80;
    server_name webot.geneyuriy.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name webot.geneyuriy.com;

    ssl_certificate /etc/letsencrypt/live/webot.geneyuriy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webot.geneyuriy.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8m;

    location / {
        proxy_pass http://10.16.6.15:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
